<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8" />
<title>RastAI</title>
<style>
  body {
    font-family: Tahoma, "Segoe UI", Arial, sans-serif;
    width: 270px;
    padding: 16px;
    margin: 0;
    color: #222;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 12px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0;
  }
  .switch {
    position: relative;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    inset: 0;
    background: #ccc;
    border-radius: 22px;
    cursor: pointer;
    transition: 0.2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    right: 2px;
    top: 2px;
    background: white;
    border-radius: 50%;
    transition: 0.2s;
  }
  input:checked + .slider {
    background: #4caf50;
  }
  input:checked + .slider::before {
    transform: translateX(-18px);
  }
  p {
    font-size: 11px;
    color: #666;
    line-height: 1.7;
    margin-top: 12px;
  }
  .hint {
    font-size: 11px;
    color: #999;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <h1>RastAI</h1>
  <div class="row">
    <span>فعال باشد</span>
    <span class="switch">
      <input type="checkbox" id="toggle" />
      <span class="slider"></span>
    </span>
  </div>
  <p>
    این افزونه کلمات، اعداد و اصطلاحات انگلیسی داخل متن فارسی را جدا می‌کند تا
    ترتیب نمایش آن‌ها (مثلاً در پاسخ چت‌بات‌های هوش مصنوعی) درست دیده شود.
  </p>
  <div class="hint">فقط روی سایت‌های چت‌بات هوش مصنوعی فعاله (نه کل وب). برای اعمال روی صفحات باز، آن‌ها را رفرش کنید.</div>
  <script src="popup.js"></script>
</body>
</html>
